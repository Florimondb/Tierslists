<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Anime Tracker</title>
</head>
<body>
    <h1>Anime Tracker</h1>
    <div class="nav-links">
        <a href="index.html">Accueil</a>
        <a href="webtoons.html">Voir les Webtoons</a>
        <a href="add_anime.html">Ajout Animes</a>
    </div>
    <div class="filters">
        <input type="text" id="searchAnimes" placeholder="Rechercher un Anime...">
        <select id="status">
            <option value="">Statut</option>
            <option value="En cours">En cours</option>
            <option value="Terminé">Terminé</option>
            <option value="À voir">À voir</option>
            <option value="Abandonné">Abandonné</option>
        </select>
    </div>
    <div class="container" id="animeGrid">
        <script src="display_anime.js"></script>
        <div class="card" data-name="Nom de l'Anime" data-status="En cours" data-genre="Action" data-note="9">
            <img src="example.jpg" alt="Anime">
            <h3>Nom de l'Anime</h3>
            <p>Statut: En cours</p>
            <p>Genre: Action</p>
            <p>Note: 9/10</p>
        </div>
        <!-- Ajoute ici d'autres Animes -->
    </div>
</body>
</html>
